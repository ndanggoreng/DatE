<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dat E</title>
    <link rel="icon" type="image/png" href="/assets/app_icon.png">
    <link rel="stylesheet" href="/web/style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/assets/app_icon.png" alt="Dat E">
        </div>

        <h1 id="appTitle">Dat E</h1>
        <p class="tagline" id="appTagline">Data Transfer Local</p>
        <p class="version" id="appVersion">v1.0.1</p>

        <label class="file-label">
            <input type="file" id="fileInput">
            <span class="file-placeholder">Pilih file</span>
        </label>
        <p class="file-name" id="fileName"></p>

        <button class="upload-btn" onclick="uploadFile()">Kirim File</button>

        <div class="progress-container">
            <div id="progressBar"></div>
        </div>
        <p id="status"></p>
    </div>
    <script src="/web/app.js"></script>
</body>
</html>
